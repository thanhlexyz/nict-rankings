baseURL = '/'
locale = 'en-us'
title = 'NICT citations, checked'
disableKinds = ['taxonomy', 'term', 'rss']
enableRobotsTXT = true

[params]
  description = 'Google Scholar citations of NICT researchers, counted only for papers that name the researcher as an author, with journal quartiles and CORE conference ranks.'
  # A local build asks search engines not to index it.
  local = true

[menus]
  [[menus.main]]
    name = 'Ranking'
    pageRef = '/'
    weight = 1
  [[menus.main]]
    name = 'Analysis'
    pageRef = '/analysis/'
    weight = 2
  [[menus.main]]
    name = 'Cooperation'
    pageRef = '/cooperation/'
    weight = 3
  [[menus.main]]
    name = 'Yearly'
    pageRef = '/yearly/'
    weight = 4
  [[menus.main]]
    name = 'Open issues'
    pageRef = '/issues/'
    weight = 5
  [[menus.main]]
    name = 'About'
    pageRef = '/about/'
    weight = 6
